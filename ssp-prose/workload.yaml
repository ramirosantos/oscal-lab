cm-7.5: >-
  Allow-by-exception ueber signierte Images war vorgesehen, ist aber NICHT
  umgesetzt: die Kyverno ImageValidatingPolicy verify-image-signature scheitert
  an der Registry-Authentifizierung gegenueber Docker Hub (siehe POA&M).
  Aktuell wird jedes Image aus docker.io/labuser zugelassen, unabhaengig von
  einer Signatur.
cm-14: >-
  Cosign-Signaturpruefung im Admission-Pfad war vorgesehen, ist aber NICHT
  aktiv: die zugehoerige Kyverno-Policy laesst sich in diesem Lab wegen eines
  ungeloesten Credential-Problems gegenueber Docker Hub nicht produktiv
  betreiben. Abweichung ist bekannt und als POA&M-Item erfasst.
si-7: >-
  Integritaet wird durch ein read-only Root-Dateisystem (Kyverno
  require-ro-rootfs, aktiv) sichergestellt; die zusaetzlich vorgesehene
  Cosign-Signaturpruefung ist NICHT aktiv (siehe CM-14). Der taegliche
  Soll-Ist-Vergleich gegen das GitHub-Repository (SI-7.1) laeuft unveraendert.

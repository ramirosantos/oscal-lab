apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-batch
  namespace: prod-batch
  labels: { app: legacy-batch }
  annotations:
    oscal.cyberlab.local/exception-ticket: "LAB-4711"
    oscal.cyberlab.local/exception-reason: "Legacy-Anwendung, Refactoring geplant Q4/2026"
spec:
  replicas: 1
  selector:
    matchLabels: { app: legacy-batch }
  template:
    metadata:
      labels: { app: legacy-batch }
    spec:
      nodeSelector: { zone: batch }
      imagePullSecrets:
        - name: dockerhub
      containers:
        - name: batch
          image: docker.io/library/busybox:1.36     # nicht signiert, fremdes Repository
          command: ["/bin/sh", "-c", "while true; do date; sleep 60; done"]
          securityContext:
            runAsUser: 0                            # root
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              add: ["NET_ADMIN", "SYS_ADMIN"]
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }


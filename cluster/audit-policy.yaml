apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: ["RequestReceived"]
rules:
  # --- Rauschen unterdruecken: sonst ist das Log unbrauchbar ---
  - level: None
    users: ["system:kube-proxy"]
    verbs: ["watch"]
  - level: None
    userGroups: ["system:nodes"]
    verbs: ["get"]
  - level: None
    nonResourceURLs: ["/healthz*", "/readyz*", "/livez*", "/metrics", "/version"]

  # --- AC-6(9): Nutzung privilegierter Funktionen vollstaendig protokollieren ---
  - level: RequestResponse
    resources:
      - group: ""
        resources: ["pods/exec", "pods/attach", "pods/portforward"]
      - group: ""
        resources: ["secrets", "serviceaccounts/token"]
      - group: "rbac.authorization.k8s.io"
        resources: ["*"]

  # --- Alle schreibenden Zugriffe mit Request-Body ---
  - level: Request
    verbs: ["create", "update", "patch", "delete", "deletecollection"]

  # --- Alles Uebrige auf Metadata-Ebene ---
  - level: Metadata

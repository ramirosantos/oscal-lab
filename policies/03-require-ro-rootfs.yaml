apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: require-ro-rootfs
  annotations:
    oscal.cyberlab.local/rule-id: kyv-readonly-rootfs
    oscal.cyberlab.local/controls: "si-7"
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    admission:  { enabled: true }
    background: { enabled: true }
  matchConstraints:
    namespaceSelector:
      matchLabels: { oscal.cyberlab.local/scope: "workload" }
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem) &&
          c.securityContext.readOnlyRootFilesystem == true)
      messageExpression: >-
        "SI-7: readOnlyRootFilesystem=true fehlt in Pod '" + object.metadata.name +
        "'. Schreibpfade ueber emptyDir-Volumes abbilden."
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]

